<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bioinforum | Bioinformatics Discussion Forum</title>
  <meta name="description" content="BIOInformatics FOrum for Research, Understanding and Methodologies" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,500;1,700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d12;
      --card-bg: #121820;
      --border: #212c3a;
      --text-white: #f0f6fc;
      --text-muted: #8b949e;
      --rum-amber: #f5b041;
      --rum-glow: rgba(245, 176, 65, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Platform Tag */
    .platform-tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--rum-amber);
      background: var(--rum-glow);
      border: 1px solid rgba(245, 176, 65, 0.3);
      padding: 6px 14px;
      border-radius: 4px;
      margin-bottom: 28px;
    }

    /* The Radial Graphic / Avatar */
    .avatar-ring {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      margin-bottom: 24px;
      background: radial-gradient(circle, #090d12 46%, transparent 48%),
                  conic-gradient(from 0deg, #2b1704, #b8860b, #ffd700, #b8860b, #2b1704, #b8860b, #ffd700, #2b1704);
      box-shadow: 0 0 40px rgba(245, 176, 65, 0.18);
      border: 1px solid rgba(245, 176, 65, 0.25);
    }

    /* Custom Hybrid Wordmark */
    .wordmark-container {
      margin-bottom: 12px;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
    }

    .part-bio {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.4rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: -1.5px;
    }

    .part-in {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 3.8rem;
      color: #e6edf3;
      padding: 0 2px;
      transform: translateY(-2px);
    }

    .part-fo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.4rem;
      font-weight: 700;
      color: var(--rum-amber);
      letter-spacing: -1.5px;
    }

    .part-rum {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 3.4rem;
      font-weight: 800;
      color: var(--rum-amber);
      letter-spacing: -1px;
    }

    /* Strategic Headline */
    .strategic-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* Backronym Subtitle */
    .backronym {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 580px;
      margin-bottom: 28px;
    }

    .backronym strong {
      color: var(--text-white);
      font-weight: 600;
    }

    .accent-letter {
      color: var(--rum-amber);
      font-weight: 800;
    }

    /* Minimal Pill Links */
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
    }

    .link-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background-color: var(--card-bg);
      transition: all 0.2s ease;
    }

    .link-pill:hover {
      color: var(--rum-amber);
      border-color: var(--rum-amber);
      background-color: rgba(245, 176, 65, 0.08);
    }

    footer {
      margin-top: 48px;
      font-size: 0.82rem;
      color: #4b5665;
      font-family: 'JetBrains Mono', monospace;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="platform-tag">Bioinformatics Discussion Forum</div>

    <!-- Radial Graphic -->
    <div class="avatar-ring"></div>

    <!-- The Dual Wordmark -->
    <div class="wordmark-container">
      <span class="part-bio">bio</span>
      <span class="part-in">in</span>
      <span class="part-fo">fo</span>
      <span class="part-rum">rum</span>
    </div>

    <!-- Clear Mission Statement -->
    <div class="strategic-title">Open Research &amp; Computational Salon</div>

    <!-- Official Backronym -->
    <p class="backronym">
      <strong><span class="accent-letter">BIO</span>Informatics</strong> 
      <strong><span class="accent-letter">FO</span>rum</strong> for 
      <strong><span class="accent-letter">R</span>esearch</strong>, 
      <strong><span class="accent-letter">U</span>nderstanding</strong> and 
      <strong><span class="accent-letter">M</span>ethodologies</strong>
    </p>

    <!-- Essential Links -->
    <div class="links">
      <a href="https://instagram.com/bioinforum" target="_blank" class="link-pill">Instagram</a>
      <a href="https://github.com/bioinforum" target="_blank" class="link-pill">GitHub</a>
      <a href="https://souravmohanty.com" target="_blank" class="link-pill">Curator</a>
    </div>
  </div>

  <footer>
    <a href="https://souravmohanty.com">souravmohanty.com</a> &bull; bioinforum.org
  </footer>

</body>
</html>
