<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIOINFORUM</title>
  <meta name="description" content="BIOInformatics FOrum for Research, Understanding and Methodologies" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --text-white: #f0f6fc;
      --text-muted: #8b949e;
      --rum-yellow: #f5b041;
      --border: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Circular Iris / Radial Graphic */
    .avatar-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin-bottom: 32px;
      background: radial-gradient(circle, #000 48%, transparent 50%),
                  conic-gradient(from 0deg, #3d2208, #b8860b, #ffd700, #b8860b, #3d2208, #b8860b, #ffd700, #3d2208);
      box-shadow: 0 0 35px rgba(245, 176, 65, 0.15);
      border: 1px solid rgba(245, 176, 65, 0.2);
    }

    /* Wordmark: reads both "bioinfo rum" and "bio in forum" */
    .wordmark {
      font-size: 2.8rem;
      letter-spacing: -0.5px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .part-bio {
      color: var(--text-white);
    }

    .part-info {
      color: #e6edf3;
    }

    .part-rum {
      color: var(--rum-yellow);
      font-weight: 900;
    }

    /* Subtitle: The Exact Backronym */
    .backronym {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 520px;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }

    .backronym strong {
      color: var(--text-white);
      font-weight: 600;
    }

    .accent-letter {
      color: var(--rum-yellow);
    }

    /* Minimal Pill Links */
    .links {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .link-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .link-pill:hover {
      color: var(--rum-yellow);
      border-color: var(--rum-yellow);
    }

    footer {
      position: absolute;
      bottom: 24px;
      font-size: 0.8rem;
      color: #484f58;
      font-family: 'JetBrains Mono', monospace;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Instagram-style Radial Disc / Ring -->
    <div class="avatar-ring"></div>

    <!-- The Dual Wordmark -->
    <h1 class="wordmark">
      <span class="part-bio">bio</span><span class="part-info">info</span><span class="part-rum">rum</span>
    </h1>

    <!-- Official Backronym -->
    <p class="backronym">
      <strong><span class="accent-letter">BIO</span>Informatics</strong> 
      <strong><span class="accent-letter">FO</span>rum</strong> for 
      <strong><span class="accent-letter">R</span>esearch</strong>, 
      <strong><span class="accent-letter">U</span>nderstanding</strong> and 
      <strong><span class="accent-letter">M</span>ethodologies</strong>
    </p>

    <!-- Essential Links -->
    <div class="links">
      <a href="https://instagram.com/bioinforum" target="_blank" class="link-pill">Instagram</a>
      <a href="https://github.com/bioinforum" target="_blank" class="link-pill">GitHub</a>
      <a href="https://souravmohanty.com" target="_blank" class="link-pill">Curator</a>
    </div>
  </div>

  <footer>
    <a href="https://souravmohanty.com">souravmohanty.com</a> &bull; bioinforum.org
  </footer>

</body>
</html>
